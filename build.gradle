 */

plugins {
	id 'java-library'
	id 'maven-publish'
}

ext {
	project_name = 'MarshmallIOw'
	project_version = "$version".toString()
	project_description = "Easy-to-use library handling files for multiple purposes"
	group_id = "fr.278deco"
	artifact_id = 'marshmalliow'
	
	// Dependencies version
	mariadb_version = '1.1.4'
	log4j_version = '2.20.0'
	junit_version = '5.10.0'
}

allprojects {
	apply plugin: 'java-library'
	apply plugin: 'maven-publish'
	
	group = group_id
	version = project_version
	description = project_description

	java {
		sourceCompatibility = JavaVersion.VERSION_18
		targetCompatibility = JavaVersion.VERSION_18
	}
	
	repositories {
		mavenCentral()
		mavenLocal()
	}
	
	 tasks.withType(JavaCompile) {
		options.encoding = 'UTF-8'
		options.incremental = true
	}
	
	tasks.withType(Javadoc) {
		options.encoding = 'UTF-8'
		if(JavaVersion.current().isJava9Compatible()) {
			options.addBooleanOption('html5', true)
		}
		
		options.tags = ["todo:X", 'apiNote:a:API Note:', 'implSpec:a:Implementation Requirements:', 'implNote:a:Implementation Note:']
	}
	
	java {
		withJavadocJar()
		withSourcesJar()
	}
	
	test {
		useJUnitPlatform()
	}
}

subprojects {
	base {
		archivesName = "${artifact_id}-${project.name}"
	}

	// task.withType(Javadoc).configureEach {
	// 	title = "${base.archivesName.get()} ${project.version} API"
	// 	options.windowTitle = title
	// }

	plugins.withType(JavaPlugin) {
		publishing {
			publications {
				mavenJava(MavenPublication) {
					from components.java

					afterEvaluate {
						artifactId = base.archivesName.get()
					}

					groupId = group_id
					version = project_version
				
					
					pom {
						name = 'MarshmallIOw'
						description = 'Easy-to-use library handling files for multiple purposes'
						url = 'https://github.com/278deco/MarshmallIOw'
						licenses {
							license {
								name = "LGPLv3"
								url = "https://github.com/278deco/MarshmallIOw/blob/main/LICENCE"
							}
						}
						developers {
							developer {
								name = '278deco'
							}
						}
					}
					
					versionMapping {
						usage('java-api') {
							fromResolutionOf('runtimeClasspath')
						}
						usage('java-runtime') {
							fromResolutionResult()
						}
					}
					
				}
			}
		}
	}
}